server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api/* al ALB
    location /api/ {
        proxy_pass http://alb-matias-fernandez-698761497.us-east-1.elb.amazonaws.com/api/;
        proxy_http_version 1.1;
        proxy_set_header Host alb-matias-fernandez-698761497.us-east-1.elb.amazonaws.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
